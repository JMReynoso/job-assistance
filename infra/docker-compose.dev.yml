name: job-assistant

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
    volumes:
      - ../web:/app
      - /app/node_modules
      - /app/.next

  api:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    # Override the image CMD to run under the Node inspector so VS Code can
    # attach and hit breakpoints. `0.0.0.0:9229` (not the default 127.0.0.1)
    # is what makes the debugger reachable from the host across the container
    # boundary. --watch still recompiles/restarts on save; the "Debug API:
    # attach (Docker)" launch config re-attaches automatically (restart:true).
    command: ./node_modules/.bin/nest start --debug 0.0.0.0:9229 --watch
    ports:
      - "4001:4001"
      # Node inspector (debugger) — matches the launch.json attach config.
      - "9229:9229"
    environment:
      NODE_ENV: development
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: job_assistance
      # ANTHROPIC_API_KEY is intentionally NOT set here — it's read from
      # api/.env (loaded by NestJS ConfigModule via the ../api bind mount).
      # Setting it here would override that file with an empty value.
    volumes:
      - ../api:/app
      - /app/node_modules
      # Keeps compiled output in a fast container volume off the Windows bind
      # mount. Because this is a mountpoint, nest-cli.json must keep
      # deleteOutDir:false — otherwise `nest start --watch` errors trying to
      # rmdir it (EBUSY).
      - /app/dist
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_assistance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Skip the login screen — dev-only convenience.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  # Named volume, independent of the container lifecycle — data survives
  # `docker compose down` / rebuilds / new images, not just container restarts.
  # Only `docker compose down -v` (or deleting the volume directly) wipes it.
  #
  # Explicit name (rather than the project-prefixed default) so dev and prod
  # never collide even though they now share the "job-assistant" project
  # name — this stays the *only* thing keeping their data apart if they're
  # ever run on the same Docker host.
  postgres-data:
    name: job-assistant-dev-postgres-data
  pgadmin-data:
    name: job-assistant-dev-pgadmin-data

networks:
  default:
    name: job-assistant-dev
