name: job-assistant

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
    volumes:
      - ../web:/app
      - /app/node_modules
      - /app/.next

  api:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: development
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: job_assistance
    volumes:
      - ../api:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_assistance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  # Named volume, independent of the container lifecycle — data survives
  # `docker compose down` / rebuilds / new images, not just container restarts.
  # Only `docker compose down -v` (or deleting the volume directly) wipes it.
  #
  # Explicit name (rather than the project-prefixed default) so dev and prod
  # never collide even though they now share the "job-assistant" project
  # name — this stays the *only* thing keeping their data apart if they're
  # ever run on the same Docker host.
  postgres-data:
    name: job-assistant-dev-postgres-data

networks:
  default:
    name: job-assistant-dev
