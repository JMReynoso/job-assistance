name: job-assistant

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      # Override these via exported shell env vars or `--env-file` at deploy
      # time rather than editing the defaults below.
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-job_assistance}
      # Provide at deploy time (exported shell env or `--env-file`). No
      # api/.env here — the prod image has no bind mount — so the key must
      # come through the environment. Empty default keeps prod bootable when
      # AI features aren't in use.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Generated resume PDFs. Named volume at RESUME_STORAGE_DIR (set in the
      # Dockerfile) so they survive container rebuilds.
      - resume-storage:/app/storage/resumes
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-job_assistance}
    # No host port mapping: only `api` needs to reach Postgres, over the
    # compose network by service name — keep it off the host's network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  # Named volume, independent of the container lifecycle — data survives
  # `docker compose down` / rebuilds / new images, not just container restarts.
  # Only `docker compose down -v` (or deleting the volume directly) wipes it.
  #
  # Explicit name (rather than the project-prefixed default) so dev and prod
  # never collide even though they now share the "job-assistant" project
  # name — this stays the *only* thing keeping their data apart if they're
  # ever run on the same Docker host.
  postgres-data:
    name: job-assistant-prod-postgres-data
  resume-storage:
    name: job-assistant-prod-resume-storage

networks:
  default:
    name: job-assistant-prod
